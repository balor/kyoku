[package]
name = "kyoku"
version = "0.2.0"
edition = "2024"
description = "A TUI-first music library manager"
default-run = "kyoku"

[dependencies]
# TUI
ratatui = "0.30"
crossterm = "0.29"

# Cover art preview. `chafa-dyn` is opted out so the build doesn't require
# a system libchafa; kitty/iterm2/sixel/halfblocks cover the common cases.
ratatui-image = { version = "10", default-features = false, features = ["crossterm", "image-defaults"] }
image = "0.25"

# CLI
clap = { version = "4", features = ["derive"] }

# Audio metadata
lofty = "0.23"

# Database
rusqlite = { version = "0.39", features = ["bundled"] }

# Config
serde = { version = "1", features = ["derive"] }
toml = "1"

# Interactive prompts
inquire = "0.9"

# Error handling
thiserror = "2"
anyhow = "1"

# HTTP client (for MusicBrainz/AcoustID API)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"

# Fuzzy string matching (for MB match scoring)
strsim = "0.11"

# Filesystem
walkdir = "2"
dirs = "6"

# Unicode
unicode-width = "0.2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "kyoku"
path = "src/main.rs"

[[bin]]
name = "create_fixtures"
path = "tests/fixtures/create_fixtures.rs"

[dev-dependencies]
tempfile = "3"
